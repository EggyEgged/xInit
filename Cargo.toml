[workspace]
resolver = "3"
members = ["crates/xinit-api", "crates/xinit-core", "crates/xinit-manager"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
xinit-api = { path = "crates/xinit-api" }
xinit-manager = { path = "crates/xinit-manager" }

[profile.release]
# PID 1 must never unwind; a panic in Core aborts immediately so the failure is loud.
panic = "abort"
